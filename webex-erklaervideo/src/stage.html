<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Webex Erklärvideo – Bühne</title>
<style>
:root{
  --red1:#FF281E; --red2:#D60000; --red:#E3000F;
  --ink:#15171C; --mut:#6B7280; --mut2:#9AA0A8; --line:#E7E8EB; --bg:#F2F3F5;
  --soft:#F7F7F8; --hl:#FFF1F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
  font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.10;background:var(--red1)}

/* Fenster */
.win{position:absolute;background:#fff;border-radius:22px;overflow:hidden;
  box-shadow:0 34px 90px rgba(20,22,40,.13),0 4px 16px rgba(20,22,40,.06)}
.tbar{height:46px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;gap:9px;font-size:15px;color:var(--mut);font-weight:600}
.tdot{width:12px;height:12px;border-radius:50%;background:#DCDEE2}
.tbar .ttl{margin-left:12px}

/* Outlook */
.ol-body{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex}
.ol-folders{width:250px;background:#FAFAFB;border-right:1px solid var(--line);padding:22px 16px}
.ol-new{background:#1F5FAD;color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;font-size:16px;margin-bottom:22px;text-align:center}
.ol-f{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:9px;font-size:17px;color:#3A3F47;margin-bottom:4px}
.ol-f.act{background:#E8EEF7;font-weight:700;color:#173F75}
.ol-cnt{font-weight:800;color:#1F5FAD;font-variant-numeric:tabular-nums}
.ol-main{flex:1;position:relative;overflow:hidden}
.ol-head{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;font-size:21px;font-weight:700;gap:14px}
.ol-head .pill{font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px;background:#EEF2F8;color:#1F5FAD}
.ol-list{position:absolute;top:62px;left:0;right:0;bottom:0;overflow:hidden}
.mrow{position:absolute;left:0;right:0;height:72px;border-bottom:1px solid #EFF0F2;padding:12px 26px 0 36px;background:#fff;transform-origin:50% 0}
.mrow .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:#1F5FAD}
.mrow .snd{font-size:16px;font-weight:700;color:#1E2228}
.mrow .tm{position:absolute;right:26px;top:13px;font-size:14px;color:var(--mut)}
.mrow .sub{font-size:16px;color:#1F5FAD;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.mrow.imp{background:#FFF7F6}
.mrow.imp .bar{background:var(--red)}
.mrow.imp .sub{color:#B0000A}
.mrow .flag{position:absolute;right:26px;top:38px;font-size:13px;font-weight:800;color:#fff;background:var(--red);border-radius:6px;padding:3px 8px;letter-spacing:.02em}

/* Webex */
.wx-body{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex}
.wx-rail{width:70px;background:#F4F4F5;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:18px;gap:10px}
.wx-rail .ri{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.wx-rail .ri.act{background:#E4E5E8}
.wx-rail svg{width:26px;height:26px;stroke:#3C4048;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wx-me{width:40px;height:40px;border-radius:50%;background:#5B6B8C;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.wx-spaces{width:340px;border-right:1px solid var(--line);position:relative;background:#fff}
.wx-search{margin:16px 16px 10px;height:44px;border-radius:12px;background:#F2F3F5;display:flex;align-items:center;padding:0 14px;gap:10px;font-size:16px;color:var(--mut2);position:relative}
.wx-search svg{width:18px;height:18px;stroke:#8A9099;fill:none;stroke-width:2.2}
.wx-search .q{color:var(--ink);font-weight:600}
.wx-search .caret{display:inline-block;width:2px;height:20px;background:var(--red);vertical-align:middle;margin-left:1px}
.wx-team{padding:10px 22px 8px;font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.sp{display:flex;align-items:center;gap:13px;padding:10px 18px;margin:2px 8px;border-radius:12px;position:relative}
.sp img{width:46px;height:46px;border-radius:12px;flex:none}
.sp .nm{font-size:18px;font-weight:700}
.sp .pv{font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;margin-top:2px}
.sp.act{background:#F1F2F4}
.sp .bdg{position:absolute;right:16px;top:50%;transform:translateY(-50%);min-width:26px;height:26px;border-radius:13px;background:var(--red);
  color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.wx-chat{flex:1;position:relative;background:#fff;overflow:hidden}
.wx-head{height:110px;border-bottom:1px solid var(--line);padding:16px 28px 0}
.wx-head .row1{display:flex;align-items:center;gap:14px}
.wx-head img{width:40px;height:40px;border-radius:10px}
.wx-head .hn{font-size:22px;font-weight:800}
.wx-tabs{display:flex;gap:30px;margin-top:16px;font-size:16px;font-weight:600;color:var(--mut)}
.wx-tabs span{padding-bottom:10px;border-bottom:3px solid transparent}
.wx-tabs span.act{color:var(--ink);border-color:var(--ink)}
.wx-msgs{position:absolute;top:110px;left:0;right:0;bottom:92px;overflow:hidden}
.wx-stack{position:absolute;left:0;right:0;bottom:0;padding:0 28px 10px}
.wx-comp{position:absolute;left:24px;right:24px;bottom:22px;height:54px;border:1.5px solid #DADCE0;border-radius:14px;display:flex;align-items:center;padding:0 18px;font-size:16px;color:var(--mut2)}
.mw{overflow:hidden}
.msg{display:flex;gap:14px;padding:12px 0 10px}
.av{width:44px;height:44px;border-radius:50%;flex:none;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.msg .who{font-size:17px;font-weight:700}
.msg .who .tm{font-weight:500;color:var(--mut2);font-size:14px;margin-left:8px}
.msg .tx{font-size:21px;line-height:1.42;margin-top:3px;color:#22252B;max-width:690px}
.mention{background:#FDE7E5;color:#B3000B;font-weight:700;border-radius:6px;padding:0 5px}
.file{display:inline-flex;align-items:center;gap:12px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-size:16px;font-weight:600}
.file .ext{width:38px;height:44px;border-radius:7px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.reacts{display:flex;gap:10px;margin-top:10px}
.react{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:99px;padding:5px 14px 5px 10px;font-size:18px;font-weight:700;background:#fff}
.react.mine{border-color:#F3A7A1;background:#FFF3F2;color:#B3000B}
.react .e{font-size:20px}
.react .n{font-variant-numeric:tabular-nums;min-width:12px}
.thread{margin-left:58px;border-left:3px solid #E3E4E7;padding-left:18px}
.thread .av{width:36px;height:36px;font-size:14px}
.thread .tx{font-size:20px}
.tlabel{margin-left:58px;font-size:15px;font-weight:700;color:var(--red);padding:2px 0 6px}
.code{margin-top:8px;background:#F6F7F9;border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;font-size:20px;line-height:1.45;color:#2A2E35}
.pinbar{position:absolute;left:0;right:0;top:110px;height:58px;background:#FFF7F6;border-bottom:1px solid #F6D3D0;display:flex;align-items:center;gap:12px;padding:0 28px;font-size:17px;z-index:3}
.pinbar b{color:#B3000B}
.pinicon{font-size:20px}

/* Linke Spalte */
.fc{position:absolute;left:96px;top:0;width:500px}
.fc .ico{position:absolute;left:0;top:178px;width:176px;height:176px;border-radius:40px;overflow:hidden;box-shadow:0 22px 50px rgba(214,0,0,.28)}
.fc .ico img{width:100%;height:100%;display:block}
.fc .kick{position:absolute;left:2px;top:392px;font-size:18px;font-weight:800;letter-spacing:.14em;color:var(--red)}
.fc .ttl{position:absolute;left:0;top:422px;font-size:56px;line-height:1.06;font-weight:800;letter-spacing:-.02em;width:500px}
.chips{position:absolute;left:0;top:572px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.chip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:99px;padding:10px 24px 10px 10px;font-size:24px;font-weight:700;
  box-shadow:0 10px 26px rgba(20,22,40,.08);white-space:nowrap}
.chip .ci{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--red1),var(--red2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}

/* Allgemein */
.headline{position:absolute;font-weight:800;letter-spacing:-.02em}
.bigq{position:absolute;width:190px;height:190px;border-radius:50%;background:linear-gradient(135deg,var(--red1),var(--red2));color:#fff;
  font-size:130px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(214,0,0,.35)}
.tag{position:absolute;background:#fff;border-radius:16px;padding:14px 22px;font-size:24px;font-weight:700;box-shadow:0 14px 34px rgba(20,22,40,.12);white-space:nowrap}
.cursor{position:absolute;width:34px;height:34px;z-index:20;opacity:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.ripple{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid var(--red);z-index:19}
.label{position:absolute;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.card-lbl{display:flex;align-items:center;gap:12px}

/* Meeting / Slido */
.meet{position:absolute;background:#16171B;border-radius:22px;overflow:hidden;box-shadow:0 34px 90px rgba(20,22,40,.25)}
.tile{position:absolute;background:#26282E;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile .av{width:96px;height:96px;font-size:32px}
.tile .nmt{position:absolute;left:14px;bottom:12px;color:#fff;font-size:15px;font-weight:600;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:8px}
.ctrl{position:absolute;left:0;bottom:0;height:86px;display:flex;align-items:center;justify-content:center;gap:16px}
.cb{width:52px;height:52px;border-radius:50%;background:#2E3036}
.cb.end{background:#E0242E;width:78px;border-radius:26px}
.slido{position:absolute;top:0;right:0;bottom:0;width:430px;background:#fff;padding:26px 28px}
.slido .sh{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:800}
.slido .live{font-size:13px;font-weight:800;color:#fff;background:#1D9E58;border-radius:6px;padding:3px 8px;letter-spacing:.06em}
.slido .q{font-size:21px;font-weight:700;line-height:1.35;margin:26px 0 22px}
.opt{margin-bottom:20px}
.opt .ol{display:flex;justify-content:space-between;font-size:17px;font-weight:600;margin-bottom:8px}
.opt .tr{height:14px;border-radius:7px;background:#EEF0F2;overflow:hidden}
.opt .fi{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--red1),var(--red2))}
.anon{display:inline-flex;align-items:center;gap:10px;margin-top:14px;background:#15171C;color:#fff;border-radius:99px;padding:9px 18px;font-size:17px;font-weight:700}

/* Notifications */
.pop{position:absolute;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(20,22,40,.22);padding:22px 24px;width:430px;z-index:10}
.pop .ph{font-size:18px;font-weight:800;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.radio{display:flex;align-items:center;gap:14px;padding:11px 6px;font-size:18px;font-weight:600;border-radius:10px}
.radio .rb{width:22px;height:22px;border-radius:50%;border:2px solid #B9BDC4;position:relative;flex:none}
.radio .rb i{position:absolute;inset:4px;border-radius:50%;background:var(--red)}

/* Schluss */
.endbg{position:absolute;inset:0;background:linear-gradient(135deg,var(--red1),var(--red2))}
.endicon{position:absolute;width:150px;height:150px;border-radius:36px;overflow:hidden;box-shadow:0 18px 40px rgba(80,0,0,.35),0 0 0 5px rgba(255,255,255,.9)}
.endicon img{width:100%;height:100%}
.cta{position:absolute;background:#fff;border-radius:24px;box-shadow:0 30px 70px rgba(80,0,0,.3);padding:30px 44px}
.cta .k{font-size:18px;font-weight:800;color:var(--red);letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.cta .r{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700;margin:10px 0}
.cta .arr{color:var(--red);font-weight:800}
.cta .dst{font-weight:800}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- Hilfsfunktionen ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={
  out:x=>1-Math.pow(1-x,3),
  inout:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);},
  lin:x=>x,
};
const P=(t,s,d=.45,e=E.out)=>e(clamp((t-s)/d));
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
function st(el,{o,x,y,s,r,sx,sy}={}){
  if(typeof el==='string') el=$(el);
  if(!el) return;
  if(o!==undefined) el.style.opacity=o;
  const tr=[];
  if(x!==undefined||y!==undefined) tr.push(`translate(${x||0}px,${y||0}px)`);
  if(s!==undefined) tr.push(`scale(${s})`);
  if(sx!==undefined) tr.push(`scaleX(${sx})`);
  if(sy!==undefined) tr.push(`scaleY(${sy})`);
  if(r!==undefined) tr.push(`rotate(${r}deg)`);
  el.style.transform=tr.join(' ');
}
const show=(el,t,s,d=.4,dy=14)=>{const k=P(t,s,d);st(el,{o:k,y:(1-k)*dy});return k;};
const pop=(el,t,s,d=.45)=>{const k=P(t,s,d,E.back);st(el,{o:clamp(k*2),s:Math.max(0,k)});return k;};

let CUE=null, SFX=[];
// Startzeit des n-ten Worts, das mit prefix beginnt
function W(prefix,n=0){
  let c=0;
  for(const w of CUE.words){ if(w.t.replace(/^[„"]/,'').startsWith(prefix)){ if(c===n) return w.s; c++; } }
  throw new Error('Cue fehlt: '+prefix+' in Szene '+CUE.scene);
}
const sfx=(t,type,vol=1)=>SFX.push({t:+t.toFixed(3),type,vol});

// ---------- Daten ----------
const ICON={
  upd:'../icons/01_wichtige_updates.png', anw:'../icons/02c_anwesenheit_orte.png',
  ter:'../icons/03_terminfindung.png', day:'../icons/04_daily_stuff.png', ki:'../icons/05_ki_technik.png'
};
const SPACES=[
  {k:'upd',n:'Wichtige Updates',pv:'Neue Kreditrichtlinie ab 01.12.'},
  {k:'anw',n:'Anwesenheit',pv:'Heute im Büro, 4. OG'},
  {k:'ter',n:'Terminfindung',pv:'Teamrunde: Di oder Mi?'},
  {k:'day',n:'Daily Stuff',pv:'Kuchen in der Kaffeeküche!'},
  {k:'ki',n:'KI & Technik',pv:'Prompt für Skipi'},
];
const PEOPLE={
  KV:{n:'Katrin Vogel',c:'#7A4FD0'}, TM:{n:'Tobias Meier',c:'#0F8B8D'}, SB:{n:'Sabine Brandt',c:'#D9480F'},
  JW:{n:'Jonas Weber',c:'#2F6FDB'}, LH:{n:'Lea Hoffmann',c:'#C2255C'}, AK:{n:'Anna Keller',c:'#2B8A3E'},
};

// ---------- Bausteine ----------
const SVG={
  chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  team:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.4 0 4.3 1.4 5 4"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  call:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  cursor:'<svg viewBox="0 0 24 24"><path d="M4 2l16 9.5-7 1.6L9.5 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  bell:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#B3000B" stroke-width="2.2" stroke-linecap="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
};
function av(code,size){const p=PEOPLE[code];return `<div class="av" style="background:${p.c}${size?`;width:${size}px;height:${size}px`:''}">${code}</div>`;}
function msg(id,code,time,html,extra='',cls=''){
  return `<div class="mw ${cls}" id="${id}"><div class="msg">${av(code)}<div><div class="who">${PEOPLE[code].n}<span class="tm">${time}</span></div><div class="tx">${html}</div>${extra}</div></div></div>`;
}
function reacts(id,list){return `<div class="reacts">${list.map((r,i)=>`<span class="react${r.mine?' mine':''}" id="${id}-r${i}"><span class="e">${r.e}</span><span class="n" id="${id}-n${i}">${r.n}</span></span>`).join('')}</div>`;}

function outlook(id,x,y,w,h,title='Posteingang'){
  return `<div class="win" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
  <div class="tbar"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span><span class="ttl">Outlook – Posteingang</span></div>
  <div class="ol-body"><div class="ol-folders"><div class="ol-new">Neue E-Mail</div>
   <div class="ol-f act"><span>Posteingang</span><span class="ol-cnt" id="${id}-cnt">47</span></div>
   <div class="ol-f"><span>Entwürfe</span><span></span></div><div class="ol-f"><span>Gesendete Elemente</span></div>
   <div class="ol-f"><span>Archiv</span></div><div class="ol-f"><span>Gelöschte Elemente</span></div></div>
  <div class="ol-main"><div class="ol-head">${title}<span class="pill" id="${id}-pill">Ungelesen</span></div><div class="ol-list" id="${id}-list"></div></div></div></div>`;
}
function mrow(id,m){
  return `<div class="mrow${m.imp?' imp':''}" id="${id}"><div class="bar"></div><div class="snd">${m.f}</div><div class="tm">${m.t||'08:0'+(Math.abs(m.f.length)%10)}</div><div class="sub">${m.s}</div>${m.imp?'<div class="flag">WICHTIG</div>':''}</div>`;
}
function webex(id,x,y,w,h,active=-1,opts={}){
  const sp=SPACES.map((s,i)=>`<div class="sp${i===active?' act':''}" id="${id}-sp${i}"><img src="${ICON[s.k]}"><div><div class="nm">${s.n}</div><div class="pv">${s.pv}</div></div><div class="bdg" id="${id}-b${i}" style="opacity:0">1</div></div>`).join('');
  const a=active>=0?SPACES[active]:null;
  return `<div class="win" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
  <div class="tbar"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span><span class="ttl">Webex</span></div>
  <div class="wx-body"><div class="wx-rail"><div class="wx-me">AK</div><div class="ri act">${SVG.chat}</div><div class="ri">${SVG.team}</div><div class="ri">${SVG.cal}</div><div class="ri">${SVG.call}</div></div>
  <div class="wx-spaces" id="${id}-spaces"><div class="wx-search">${SVG.search}<span id="${id}-q">Suchen</span></div>
   <div class="wx-team">Team Immobilienfinanzierung</div>${sp}<div id="${id}-extra"></div></div>
  ${opts.noChat?'':`<div class="wx-chat" id="${id}-chat"><div class="wx-head"><div class="row1"><img id="${id}-hi" src="${a?ICON[a.k]:ICON.upd}"><span class="hn" id="${id}-hn">${a?a.n:''}</span></div>
   <div class="wx-tabs"><span class="act" id="${id}-t0">Nachrichten</span><span id="${id}-t1">Personen</span><span id="${id}-t2">Inhalte</span><span id="${id}-t3">Whiteboards</span></div></div>
   <div class="wx-msgs"><div class="wx-stack" id="${id}-stack"></div></div>
   <div class="wx-comp" id="${id}-comp">Nachricht an ${a?a.n:''} schreiben</div></div>`}
  </div></div>`;

function featureCol(iconKey,kick,title,chips){
  return `<div class="fc" id="fc"><div class="ico" id="fc-ico"><img id="fc-img" src="${ICON[iconKey]}"></div>
   <div class="kick" id="fc-kick">${kick}</div><div class="ttl" id="fc-ttl">${title}</div>

function bg(){return `<div class="blob" style="left:-220px;top:-260px;width:760px;height:760px"></div><div class="blob" style="right:-260px;bottom:-300px;width:820px;height:820px;opacity:.07"></div>`;}
function cursor(id){return `<div class="ripple" id="${id}-rp" style="opacity:0"></div><div class="cursor" id="${id}">${SVG.cursor}</div>`;}
function moveCursor(id,t,path){ // path: [[t,x,y],...], Klicks: [t]
  let x=path[0][1],y=path[0][2];
  for(let i=1;i<path.length;i++){const [t1,x1,y1]=path[i],[t0,x0,y0]=path[i-1];
    if(t>=t0){const k=E.inout(clamp((t-t0)/(t1-t0)));x=lerp(x0,x1,k);y=lerp(y0,y1,k);}}
  const el=$(id);el.style.left=x+'px';el.style.top=y+'px';
  return [x,y];
}
function ripple(id,t,tc,x,y){const k=clamp((t-tc)/.45);const el=$(id+'-rp');
  el.style.left=(x-30)+'px';el.style.top=(y-30)+'px';el.style.opacity=(t>=tc&&k<1)?(1-k):0;el.style.transform=`scale(${.3+k*.9})`;}
// Nachrichten mit gemessener Höhe einblenden
const H={};
function measure(ids){for(const id of ids){const el=$(id);el.style.height='auto';H[id]=el.offsetHeight;}}
function grow(id,t,s,d=.4){const k=P(t,s,d);const el=$(id);el.style.height=(H[id]*k)+'px';
  const inner=el.firstElementChild;inner.style.opacity=clamp(k*1.6-.3);inner.style.transform=`translateY(${(1-k)*16}px)`;return k;}
function count(id,t,s,d,a,b){const k=P(t,s,d,E.inout);$(id).textContent=Math.round(lerp(a,b,k));return k;}

         <div class="r"><span>Kurz &amp; intern</span><span class="arr">→</span><span class="dst">Webex-Space</span></div>
         <div class="r"><span>Beschlüsse &amp; Revisionsrelevantes</span><span class="arr">→</span><span class="dst">Mail</span></div></div>`;
    for(let i=0;i<5;i++) sfx(.25+i*.12,'pop',.3);
    sfx(W('Ab')-.05,'whoosh',.3);
  },
  update(t){
    for(let i=0;i<5;i++){const k=P(t,.2+i*.12,.5,E.back); st('ei'+i,{o:clamp(k*1.5),s:Math.max(0,k),y:Math.sin(t*1.6+i)*4});}
    const k1=P(t,W('Kurz')-.1,.45); st('e1',{o:k1,y:(1-k1)*24});
    const k2=P(t,W('Ab')-.05,.45,E.back); st('e2',{o:clamp(k2*1.4),s:.9+.1*k2});
    const k3=P(t,W('Das')-.2,.6); st('cta',{o:k3,y:(1-k3)*40});
  }
};

window.initScene=async function(n,cue){

  await document.fonts.load('700 20px Inter'); await document.fonts.load('20px "Noto Color Emoji"');

  if(SC[n].sfxInit) SC[n].sfxInit();
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
  await document.fonts.ready;
  // Höhen nach Font-Laden nachmessen
  for(const id of Object.keys(H)) if($(id)) { $(id).style.height='auto'; H[id]=$(id).offsetHeight; }
  window.SCENE=SC[n];
  return SFX;
};
window.renderAt=function(t){ window.SCENE.update(t); };
