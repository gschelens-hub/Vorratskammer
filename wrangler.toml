name = "zimmer-552"
main = "worker/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:buero@example.com"

# Secrets (set with `npx wrangler secret put NAME`):
#   SUPABASE_SERVICE_KEY  – Supabase service role key
#   ROOM_PIN              – shared PIN for the room
#   VAPID_PRIVATE_KEY     – from `npm run vapid`

[triggers]
# 03:17 UTC daily: keep Supabase awake.
# 06:30 + 07:30 UTC Mon–Fri: morning reminder at 8:30 Berlin (summer/winter time); the worker picks the right one.
crons = ["17 3 * * *", "30 6 * * 1-5", "30 7 * * 1-5"]
